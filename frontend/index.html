<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrafficSense</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #1b1b1b; }
  header label { display: flex; align-items: center; gap: 6px; }
  select, button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid #444; background: #222; color: #eee; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-left: auto; font-size: 0.9em; color: #aaa; }
  main { display: flex; justify-content: center; align-items: center; height: calc(100vh - 56px); }
  #frame { max-width: 100%; max-height: 100%; background: #000; }
</style>
</head>
<body>
<header>
  <select id="video"></select>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <label><input type="checkbox" id="autoplay"> Autoplay</label>
  <span id="status">disconnected</span>
</header>
<main><img id="frame" alt=""></main>

<script>
const videoSel = document.getElementById("video");
const startBtn = document.getElementById("start");
const stopBtn  = document.getElementById("stop");
const autoplay = document.getElementById("autoplay");
const statusEl = document.getElementById("status");
const frameEl  = document.getElementById("frame");

let ws = null;

function setStatus(s) { statusEl.textContent = s; }
function setPlaying(p) {
  startBtn.disabled = p;
  stopBtn.disabled = !p;
  videoSel.disabled = p;
}

async function loadVideos() {
  const r = await fetch("/videos");
  const { videos } = await r.json();
  videoSel.innerHTML = "";
  for (const v of videos) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    videoSel.appendChild(opt);
  }
  if (!videos.length) {
    const opt = document.createElement("option");
    opt.textContent = "(nie znaleziono filmów)";
    opt.disabled = true;
    videoSel.appendChild(opt);
    startBtn.disabled = true;
  }
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen  = () => setStatus("connected");
  ws.onclose = () => { setStatus("disconnected"); setPlaying(false); setTimeout(connect, 1000); };
  ws.onerror = () => setStatus("error");
  ws.onmessage = (e) => {
    if (typeof e.data === "string" && e.data.startsWith("F")) {
      frameEl.src = "data:image/jpeg;base64," + e.data.slice(1);
      return;
    }
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "started")    setStatus(`playing ${msg.video}`);
    else if (msg.type === "ended") setStatus(`ended ${msg.video}`);
    else if (msg.type === "error") setStatus(`error: ${msg.message}`);
  };
}

startBtn.onclick = () => {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ action: "start", video: videoSel.value, autoplay: autoplay.checked }));
  setPlaying(true);
};
stopBtn.onclick = () => {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ action: "stop" }));
  setPlaying(false);
};

loadVideos();
connect();
</script>
</body>
</html>

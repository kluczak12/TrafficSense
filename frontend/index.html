<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrafficSense</title>
<style>
  :root {
    --bg: #111;
    --panel: #161616;
    --panel2: #1b1b1b;
    --text: #eee;
    --muted: #aaa;
    --border: #333;
    --control: #222;
    --control-border: #444;
    --shadow: 0 12px 40px rgba(0,0,0,0.55);
    --sidebar-w: 340px;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

  .layout { position: relative; width: 100vw; height: 100vh; }

  .sidebar {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    transform: translateX(0);
    transition: transform 180ms ease;
    z-index: 10;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
  }
  .sidebar.collapsed { transform: translateX(calc(-1 * var(--sidebar-w))); }

  .logs-sidebar {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: var(--sidebar-w);
    background: var(--panel);
    border-left: 1px solid var(--border);
    transform: translateX(0);
    transition: transform 180ms ease;
    z-index: 10;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
  }
  .logs-sidebar.collapsed { transform: translateX(var(--sidebar-w)); }

  .log-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 10px;
  }
  .log-item {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel2);
    font-size: 0.9em;
  }
  .log-item .log-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 0.85em;
  }
  .log-type {
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .log-type.medium { color: #e6c84a; }
  .log-type.high { color: #e6954a; }
  .log-type.critical { color: #e64a4a; }
  .log-desc { color: var(--text); line-height: 1.35; }
  .log-empty { color: var(--muted); font-size: 0.9em; padding: 4px 0; }

  .side-header {
    padding: 12px 12px 10px;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand { font-weight: 650; letter-spacing: 0.2px; }
  .spacer { flex: 1; }
  #status { font-size: 0.9em; color: var(--muted); }

  .side-body { padding: 12px; display: grid; gap: 12px; overflow: auto; }
  .row { display: grid; gap: 8px; }
  .row label { display: flex; align-items: center; gap: 8px; color: var(--text); }

  select, button {
    font: inherit;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--control-border);
    background: var(--control);
    color: var(--text);
    width: 100%;
  }
  button { cursor: pointer; }
  button:disabled { opacity: 0.55; cursor: default; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .side-footer {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85em;
  }

  .panel-toggle {
    position: absolute;
    left: 12px;
    top: 12px;
    z-index: 20;
    border-radius: 10px;
    padding: 9px 12px;
    width: auto;
    background: rgba(34,34,34,0.75);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
  }
  .panel-toggle.hidden { display: none; }

  .logs-toggle {
    position: absolute;
    right: 12px;
    top: 12px;
    z-index: 20;
    border-radius: 10px;
    padding: 9px 12px;
    width: auto;
    background: rgba(34,34,34,0.75);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
  }
  .logs-toggle.hidden { display: none; }

  .critical-alert {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(179, 20, 20, 0.95);
    color: #fff;
    font-weight: 600;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
  }
  .critical-alert.visible {
    opacity: 1;
  }

  main {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }
  #frame {
    max-width: 100%;
    max-height: 100%;
    background: #000;
    object-fit: contain;
  }
</style>
</head>
<body>
<div class="layout">
  <button id="panelToggle" class="panel-toggle hidden" type="button">Menu</button>
  <button id="logsToggle" class="logs-toggle hidden" type="button">Logs</button>
  <div id="criticalAlert" class="critical-alert" role="alert" aria-live="assertive"></div>

  <aside id="sidebar" class="sidebar">
    <div class="side-header">
      <div class="brand">TrafficSense</div>
      <div class="spacer"></div>
      <span id="status">disconnected</span>
      <button id="hidePanel" type="button" style="width:auto;">Hide</button>
    </div>
    <div class="side-body">
      <div class="row">
        <div style="color: var(--muted); font-size: 0.9em;">Video</div>
        <select id="video"></select>
      </div>
      <div class="btn-row">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="autoplay"> Autoplay</label>
      </div>
    </div>
  </aside>

  <aside id="logsSidebar" class="logs-sidebar collapsed">
    <div class="side-header">
      <div class="brand">Logs</div>
      <div class="spacer"></div>
      <button id="hideLogsPanel" type="button" style="width:auto;">Hide</button>
    </div>
    <div class="side-body">
      <ul id="logList" class="log-list"></ul>
      <p id="logEmpty" class="log-empty">No events logged yet.</p>
    </div>
  </aside>

  <main><img id="frame" alt=""></main>
</div>

<script>
const videoSel = document.getElementById("video");
const startBtn = document.getElementById("start");
const stopBtn  = document.getElementById("stop");
const autoplay = document.getElementById("autoplay");
const statusEl = document.getElementById("status");
const frameEl  = document.getElementById("frame");
const sidebar  = document.getElementById("sidebar");
const hidePanelBtn = document.getElementById("hidePanel");
const panelToggleBtn = document.getElementById("panelToggle");
const criticalAlertEl = document.getElementById("criticalAlert");
const logsSidebar = document.getElementById("logsSidebar");
const hideLogsPanelBtn = document.getElementById("hideLogsPanel");
const logsToggleBtn = document.getElementById("logsToggle");
const logListEl = document.getElementById("logList");
const logEmptyEl = document.getElementById("logEmpty");

let ws = null;
let criticalAlertTimer = null;
const logIds = new Set();

function setStatus(s) { statusEl.textContent = s; }
function setPlaying(p) {
  startBtn.disabled = p;
  stopBtn.disabled = !p;
  videoSel.disabled = p;
}

function setSidebarCollapsed(collapsed) {
  if (collapsed) {
    sidebar.classList.add("collapsed");
    panelToggleBtn.classList.remove("hidden");
  } else {
    sidebar.classList.remove("collapsed");
    panelToggleBtn.classList.add("hidden");
  }
}
hidePanelBtn.onclick = () => setSidebarCollapsed(true);
panelToggleBtn.onclick = () => setSidebarCollapsed(false);

function setLogsSidebarCollapsed(collapsed) {
  if (collapsed) {
    logsSidebar.classList.add("collapsed");
    logsToggleBtn.classList.remove("hidden");
  } else {
    logsSidebar.classList.remove("collapsed");
    logsToggleBtn.classList.add("hidden");
  }
}
hideLogsPanelBtn.onclick = () => setLogsSidebarCollapsed(true);
logsToggleBtn.onclick = () => setLogsSidebarCollapsed(false);

function renderLogEntry(entry) {
  const id = entry.id;
  if (id != null && logIds.has(id)) return;
  if (id != null) logIds.add(id);

  const li = document.createElement("li");
  li.className = "log-item";
  li.dataset.logId = id ?? "";

  const meta = document.createElement("div");
  meta.className = "log-meta";
  const typeEl = document.createElement("span");
  typeEl.className = `log-type ${entry.type || ""}`;
  typeEl.textContent = entry.type || "unknown";
  const dateEl = document.createElement("span");
  dateEl.textContent = formatLogDate(entry.date);
  meta.append(typeEl, dateEl);

  const desc = document.createElement("div");
  desc.className = "log-desc";
  desc.textContent = entry.description || "";

  li.append(meta, desc);
  logListEl.appendChild(li);
  logEmptyEl.style.display = logListEl.children.length ? "none" : "block";
}

function formatLogDate(raw) {
  if (!raw) return "";
  const parsed = new Date(raw);
  if (!Number.isNaN(parsed.getTime())) {
    return parsed.toLocaleString();
  }

  // Backward compatibility for legacy SQLite format: YYYY-MM-DD HH:MM:SS
  const normalized = raw.includes("T") ? raw : raw.replace(" ", "T");
  const parsedAsUtc = new Date(`${normalized}Z`);
  if (!Number.isNaN(parsedAsUtc.getTime())) {
    return parsedAsUtc.toLocaleString();
  }
  return raw;
}

async function loadLogs() {
  try {
    const r = await fetch(`/logs?t=${Date.now()}`, { cache: "no-store" });
    const { logs } = await r.json();
    logListEl.innerHTML = "";
    logIds.clear();
    for (const entry of (logs || [])) renderLogEntry(entry);
    logEmptyEl.style.display = logListEl.children.length ? "none" : "block";
  } catch (_) {
    logEmptyEl.textContent = "Could not load logs.";
    logEmptyEl.style.display = "block";
  }
}

function showCriticalAlert(message) {
  criticalAlertEl.textContent = message;
  criticalAlertEl.classList.add("visible");
  if (criticalAlertTimer) clearTimeout(criticalAlertTimer);
  criticalAlertTimer = setTimeout(() => {
    criticalAlertEl.classList.remove("visible");
    criticalAlertEl.textContent = "";
    criticalAlertTimer = null;
  }, 5000);
}

async function loadVideos() {
  const r = await fetch("/videos");
  const { videos } = await r.json();
  videoSel.innerHTML = "";
  for (const v of videos) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    videoSel.appendChild(opt);
  }
  if (!videos.length) {
    const opt = document.createElement("option");
    opt.textContent = "(no videos found)";
    opt.disabled = true;
    videoSel.appendChild(opt);
    startBtn.disabled = true;
  }
}

function safeSend(obj) {
  if (!ws || ws.readyState !== 1) return false;
  ws.send(JSON.stringify(obj));
  return true;
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen  = () => setStatus("connected");
  ws.onclose = () => {
    setStatus("disconnected");
    setPlaying(false);
    setTimeout(connect, 1000);
  };
  ws.onerror = () => setStatus("error");
  let lastBlobUrl = null;
  ws.onmessage = (e) => {
    if (e.data instanceof Blob) {
      if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      lastBlobUrl = URL.createObjectURL(e.data);
      frameEl.src = lastBlobUrl;
      return;
    }

    try {
      const msg = JSON.parse(e.data);
      if (msg?.type === "started" && msg.video) {
        setStatus(`playing: ${msg.video}`);
        if (videoSel.value !== msg.video) videoSel.value = msg.video;
      }
      if (msg?.type === "ended") {
        setStatus(`ended: ${msg.video || ""}`.trim());
        if (!autoplay.checked) {
          stopBtn.onclick();
        }
      }
      if (msg?.type === "error") {
        setStatus(`error: ${msg.message || "unknown"}`);
      }
      if (msg?.type === "pedestrian_state_log") {
        loadLogs();
      }
      if (msg?.type === "pedestrian_state_alert" && msg?.to === "critical") {
        showCriticalAlert("WARNING: high risk of collision!");
      }
    } catch (_) {
    }
  };
}

startBtn.onclick = () => {
  if (!safeSend({ action: "start", video: videoSel.value, autoplay: autoplay.checked })) return;
  setPlaying(true);
};
stopBtn.onclick = () => {
  if (!safeSend({ action: "stop" })) return;
  setPlaying(false);
  setStatus("stopped");
  // after stopping, fetch a final snapshot of logs (avoid cached response)
  setTimeout(() => loadLogs(), 250);
};

setLogsSidebarCollapsed(true);
loadVideos();
loadLogs();
connect();
</script>
</body>
</html>

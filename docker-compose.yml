services:
  # kontener: data, uruchamia się jako pierwszy, kończy pracę i wychodzi
  data:
    build: ./data
    volumes:
      - ./data/videos:/data/videos:ro
      - frames_data:/data/frames
      - db_data:/data/db
      - lib:/lib
    environment:
      - VIDEO_DIR=/data/videos
      - FRAMES_DIR=/data/frames
      - ANNOTATIONS_DIR=/data/videos/annotations
    # healthcheck sprawdza czy ekstrakcja się zakończyła (istnieje plik ".done")
    # healthcheck:
    #   test: ["CMD", "test", "-f", "/data/.done"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 30 # czeka maks. 5 minut na zakończenie ekstrakcji
    #   start_period: 5s
    restart: on-failure

  # kontener: engine, startuje gdy data spełnił healthcheck
  engine:
    build: ./engine
    volumes:
      - frames_data:/data/frames
      - db_data:/data/db
      - model_data:/data/model
      - lib:/lib
    environment:
      - FRAMES_DIR=/data/frames
      - DB_PATH=/data/db/pedestrians.db
      - MODEL_PATH=/data/model
    # depends_on:
    #   data:
    #     condition: service_healthy
    restart: unless-stopped

  # kontener: api
  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./data/videos:/data/videos
      - db_data:/data/db
    environment:
      - DB_PATH=/data/db/pedestrians.db
      - VIDEO_DIR=/data/videos
    # depends_on:
    #   - engine
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 5s
    restart: unless-stopped

  # kontener: frontend, startuje gdy api odpowiada
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    # depends_on:
    #   api:
    #     condition: service_healthy
    restart: unless-stopped

volumes:
  db_data: # shared volume: SQLite
  frames_data: # wyekstrahowane klatki
  model_data: # wagi i inne elementy sieci neuronowej
  lib: # dodatkowe moduły Pythona

# zakomentowane healthcheck / depends_on - do zaimplementowania lub zmiany
# ostatecznie większość volumes jest shared - prościej niż stosować komunikację po sieci
# to zostawmy api + frontendowi

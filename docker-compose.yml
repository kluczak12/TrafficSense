services:
  # kontener: data, uruchamia się jako pierwszy, kończy pracę i wychodzi
  data:
    build: ./data
    volumes:
      - ./data/annotations:/data/annotations:ro
      - ./data/annotations_vehicle:/data/annotations_vehicle:ro
      - ./data/annotations_traffic:/data/annotations_traffic:ro
      - db_data:/data/db
    restart: on-failure

  engine:
    build: ./engine
    volumes:
      - db_data:/data/db:ro
    environment:
      - EXPECTED_MODEL_HASH=f59b3d833e2ff32e194b5bb8e08d211dc7c5bdf144b90d2c8412c47ccfc83b36
    # ODKOMENTOWAĆ DO PREZENTACJI NA MOCNYM LAPKU
    # I USUNĄĆ --index-url... Z DOCKERFILE ENGINE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      data:
        condition: service_completed_successfully
    restart: unless-stopped
  
  frontend:
    build: ./frontend
    volumes:
      - ./data/videos:/data/videos:ro
    environment:
      - ENGINE_WS=ws://engine:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  db_data: # shared volume: SQLite